# Installed by deploy.sh as /etc/nginx/sites-available/chatnav (symlinked into sites-enabled).
# TLS terminates here with a self-signed cert; the device pins its SHA-256 fingerprint.
# Photon/Delta use 8080-8090 and are not touched. This site only listens on 443.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/chatnav/tls/server.crt;
    ssl_certificate_key /etc/chatnav/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    access_log /var/log/nginx/chatnav-access.log;
    error_log  /var/log/nginx/chatnav-error.log;

    # The Pico keeps one connection open for fixes and queries.
    keepalive_timeout 300s;
    keepalive_requests 10000;

    # Audio is streamed both ways: no buffering in nginx.
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
